repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude --config pyproject.toml
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --config pyproject.toml
        language: system
        types_or: [python, pyi, markdown]

      - id: ty-check
        name: ty check
        entry: uv run ty check --output-format concise --no-progress .
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: app-lint
        name: app eslint
        entry: uv run build-app.py lint
        language: system
        types_or: [ts, tsx, javascript]
        files: ^app/
        pass_filenames: false

      - id: app-format
        name: app prettier
        entry: uv run build-app.py format
        language: system
        types_or: [ts, tsx, javascript, css, html, json, yaml, markdown]
        files: ^app/
        pass_filenames: false

      - id: app-typecheck
        name: app typecheck
        entry: uv run build-app.py typecheck
        language: system
        types_or: [ts, tsx]
        files: ^app/
        pass_filenames: false

      - id: app-build
        name: app build
        entry: uv run build-app.py build build:view
        language: system
        files: ^app/
        pass_filenames: false
