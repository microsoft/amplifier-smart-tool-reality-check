<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The app server fills this in when it serves the page. -->
    <meta name="reality-check-sandbox-port" content="{{sandbox_port}}" />
    <title>Reality Check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* The view's canvas color, so nothing flashes white before it paints. */
      body {
        background-color: #e7ecf1;
        color: #12161c;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0c0f13;
          color: #eef2f6;
        }
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
      #status {
        margin: 1rem;
      }
    </style>
  </head>
  <body>
    <p id="status" hidden></p>
    <script type="module" src="/host/host.ts"></script>
  </body>
</html>
