[project]
name = "reality-check"
version = "0.4.1"
description = "Checks that an app works the way a real user would experience it, on your machine, in a Digital Twin Universe, or in one it sets up for you, and returns evidence for every finding"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "certifi>=2026.10.19,<2027.0.0",
    "digital-twin-universe @ git+https://github.com/microsoft/amplifier-smart-tool-digital-twin-universe@8435e711eff63d533475861962f267b91fc5917a",
    "filelock>=4.0.9,<5.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "platformdirs>=4.13.0,<5.0.0",
    "psutil>=7.2.2,<8.0.0",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.2,<0.28.0",
]

[project.urls]
Repository = "https://github.com/microsoft/amplifier-smart-tool-reality-check"

[project.scripts]
reality-check = "reality_check.cli:main"

[project.optional-dependencies]
copilot = [
    "github-copilot-sdk>=1.0.21,<2.0.0",
]
amplifier-agent = [
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@v0.23.1#subdirectory=packages/python",
]
codex = [
    "openai-codex>=0.162.1,<1.0.0",
]
claude = [
    "claude-agent-sdk>=0.2.167,<0.3.0",
]
all = [
    "reality-check[copilot,amplifier-agent,codex,claude]",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reality_check"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"
# Remove once the certifi release that exclude-newer allows has no known CVE.
exclude-newer-package = { certifi = false }

[dependency-groups]
# Every agent provider, so `uv run` type checks and tests each implementation without asking for extras.
dev = [
    "reality-check[all]",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
# The evaluation harness imports its modules from `evaluations/`, the directory its script runs from.
extra-paths = ["evaluations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["evaluations"]
